<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1130 612" role="img" aria-label="NASA C-MAPSS data flows through raw, staging, core, marts and a feature store. Core and marts feed a governed semantic layer that serves a fleet report, a plain-English question box and an MCP server, checked by reconciliation and an answer eval. The feature store feeds two XGBoost classifiers, a model registry, batch scoring and a maintenance action. Numbers 1 to 8 mark the changes I would make next.">
  <style>
    .node rect { fill: #1a2f4a; stroke: #3a5373; stroke-width: 1; }
    .key rect { stroke: #5fc4c0; stroke-width: 1.6; }
    .check rect { fill: #221e17; stroke: #f0a742; stroke-width: 1.2; stroke-dasharray: 5 4; }
    .t { fill: #f2f5f9; font: 600 13.5px 'Segoe UI', 'Open Sans', Helvetica, Arial, sans-serif; }
    .d { fill: #b4c3d4; font: 400 12px 'Segoe UI', 'Open Sans', Helvetica, Arial, sans-serif; }
    .m { fill: #cfe0f2; font: 400 11.5px 'Cascadia Code', Consolas, Menlo, monospace; }
    .lane { fill: #7f95b1; font: 600 11px 'Segoe UI', 'Open Sans', Helvetica, Arial, sans-serif; letter-spacing: .08em; }
    .lbl { fill: #7f95b1; font: 400 11.5px 'Segoe UI', 'Open Sans', Helvetica, Arial, sans-serif; }
    .flow { stroke: #5fc4c0; stroke-width: 1.5; fill: none; }
    .checkline { stroke: #f0a742; stroke-width: 1.3; fill: none; stroke-dasharray: 4 3; }
    .gap circle { fill: #e5736b; }
    .gap text { fill: #0e1a2b; font: 700 12px 'Segoe UI', 'Open Sans', Helvetica, Arial, sans-serif; }
  </style>
  <defs>
    <marker id="ah-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5fc4c0"/></marker>
    <marker id="ah-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f0a742"/></marker>
  </defs>

  <text x="11" y="24" class="lane">LAYERS · SNOWFLAKE SCRIPTS 02–07 · DATABRICKS TASK 2 · KEDRO DATA_PROCESSING</text>

  <g class="node"><rect x="11" y="36" width="158" height="78" rx="6"/><text x="23" y="62" class="t">NASA C-MAPSS</text><text x="23" y="82" class="d">4 files, FD001–FD004</text><text x="23" y="99" class="d">709 + 707 engines</text></g>
  <g class="node"><rect x="199" y="36" width="158" height="78" rx="6"/><text x="211" y="62" class="t">RAW · bronze</text><text x="211" y="82" class="d">files as delivered</text><text x="211" y="99" class="d">stage / UC volume</text></g>
  <g class="node"><rect x="387" y="36" width="158" height="78" rx="6"/><text x="399" y="62" class="t">STAGING</text><text x="399" y="82" class="d">typed, named sensors</text><text x="399" y="99" class="m">FD002_001</text></g>
  <g class="node"><rect x="575" y="36" width="158" height="78" rx="6"/><text x="587" y="62" class="t">CORE</text><text x="587" y="82" class="m">dim_engine</text><text x="587" y="99" class="m">fct_telemetry</text></g>
  <g class="node"><rect x="763" y="36" width="158" height="78" rx="6"/><text x="775" y="62" class="t">MARTS</text><text x="775" y="82" class="d">RUL target</text><text x="775" y="99" class="d">capped at 130 cycles</text></g>
  <g class="node"><rect x="951" y="36" width="158" height="78" rx="6"/><text x="963" y="62" class="t">FEATURE STORE</text><text x="963" y="82" class="d">5-cycle mean + std</text><text x="963" y="99" class="d">key: engine, cycle</text></g>

  <line x1="169" y1="75" x2="197" y2="75" class="flow" marker-end="url(#ah-teal)"/>
  <line x1="357" y1="75" x2="385" y2="75" class="flow" marker-end="url(#ah-teal)"/>
  <line x1="545" y1="75" x2="573" y2="75" class="flow" marker-end="url(#ah-teal)"/>
  <line x1="733" y1="75" x2="761" y2="75" class="flow" marker-end="url(#ah-teal)"/>
  <line x1="921" y1="75" x2="949" y2="75" class="flow" marker-end="url(#ah-teal)"/>

  <path d="M654 114 V146 H560 V174" class="flow" marker-end="url(#ah-teal)"/>
  <path d="M842 114 V146 H654" class="flow"/>
  <text x="664" y="137" class="lbl">reads CORE + MARTS</text>
  <text x="199" y="166" class="lane">SEMANTIC PATH</text>

  <g class="node key"><rect x="199" y="176" width="436" height="96" rx="6"/>
    <text x="213" y="202" class="t">Governed metric definitions</text>
    <text x="213" y="224" class="d">Snowflake: semantic view FLEET_RELIABILITY</text>
    <text x="213" y="242" class="d">Databricks: fleet_engines + fleet_cycles, one per grain</text>
    <text x="213" y="260" class="d">16 metrics · synonyms · units · AI instructions</text>
  </g>

  <g class="node check"><rect x="655" y="190" width="200" height="68" rx="6"/>
    <text x="669" y="213" class="t">Reconciliation</text>
    <text x="669" y="232" class="d">each metric vs plain SQL</text>
    <text x="669" y="249" class="d">80/80 · 7/7 every job run</text>
  </g>
  <line x1="655" y1="224" x2="638" y2="224" class="checkline" marker-end="url(#ah-amber)"/>

  <line x1="213" y1="272" x2="213" y2="328" class="flow" marker-end="url(#ah-teal)"/>
  <line x1="417" y1="272" x2="417" y2="328" class="flow" marker-end="url(#ah-teal)"/>
  <line x1="621" y1="272" x2="621" y2="328" class="flow" marker-end="url(#ah-teal)"/>
  <text x="427" y="305" class="lbl">same definitions</text>

  <g class="node"><rect x="123" y="330" width="180" height="84" rx="6"/><text x="135" y="356" class="t">Fleet report</text><text x="135" y="376" class="d">reads only the layer</text><text x="135" y="394" class="d">snapshot on Databricks</text></g>
  <g class="node"><rect x="327" y="330" width="180" height="84" rx="6"/><text x="339" y="356" class="t">Ask the Fleet</text><text x="339" y="376" class="d">plain English → SQL</text><text x="339" y="394" class="d">Cortex Analyst · Genie</text></g>
  <g class="node"><rect x="531" y="330" width="180" height="84" rx="6"/><text x="543" y="356" class="t">MCP server</text><text x="543" y="376" class="d">tools for agents</text><text x="543" y="394" class="d">read-only role</text></g>

  <g class="node check"><rect x="327" y="452" width="180" height="72" rx="6"/>
    <text x="339" y="475" class="t">Answer eval</text>
    <text x="339" y="495" class="d">Cortex: 594 / 600</text>
    <text x="339" y="512" class="d">Genie: 6 / 6 samples</text>
  </g>
  <line x1="417" y1="452" x2="417" y2="417" class="checkline" marker-end="url(#ah-amber)"/>

  <text x="889" y="166" class="lane">ML PATH</text>
  <line x1="1030" y1="114" x2="1030" y2="174" class="flow" marker-end="url(#ah-teal)"/>
  <text x="1040" y="150" class="lbl">8 features</text>

  <g class="node"><rect x="889" y="176" width="220" height="84" rx="6"/><text x="901" y="202" class="t">Train, two horizons</text><text x="901" y="222" class="d">XGBoost ≤ 50 and ≤ 15 cycles</text><text x="901" y="240" class="d">threshold: F2 on val engines</text></g>
  <line x1="1030" y1="260" x2="1030" y2="298" class="flow" marker-end="url(#ah-teal)"/>
  <text x="1020" y="284" class="lbl" text-anchor="end">best val F2</text>

  <g class="node"><rect x="889" y="300" width="220" height="74" rx="6"/><text x="901" y="326" class="t">Model registry</text><text x="901" y="346" class="d">MLflow · Unity Catalog</text><text x="901" y="363" class="d">@champion, threshold inside</text></g>
  <line x1="1030" y1="374" x2="1030" y2="412" class="flow" marker-end="url(#ah-teal)"/>
  <text x="1020" y="398" class="lbl" text-anchor="end">loads @champion</text>

  <g class="node"><rect x="889" y="414" width="220" height="84" rx="6"/><text x="901" y="440" class="t">Batch score</text><text x="901" y="460" class="d">last cycle, 707 test engines</text><text x="901" y="478" class="m">engine_risk_scores</text></g>
  <line x1="1030" y1="498" x2="1030" y2="536" class="flow" marker-end="url(#ah-teal)"/>
  <text x="1020" y="522" class="lbl" text-anchor="end">decision matrix</text>

  <g class="node"><rect x="889" y="538" width="220" height="64" rx="6"/><text x="901" y="564" class="t">Maintenance action</text><text x="901" y="584" class="d">normal · schedule · immediate</text></g>

  <g class="gap"><circle cx="507" cy="452" r="11"/><text x="507" y="456.5" text-anchor="middle">1</text></g>
  <g class="gap"><circle cx="1109" cy="300" r="11"/><text x="1109" y="304.5" text-anchor="middle">2</text></g>
  <g class="gap"><circle cx="1012" cy="146" r="11"/><text x="1012" y="150.5" text-anchor="middle">3</text></g>
  <g class="gap"><circle cx="711" cy="330" r="11"/><text x="711" y="334.5" text-anchor="middle">4</text></g>
  <g class="gap"><circle cx="635" cy="176" r="11"/><text x="635" y="180.5" text-anchor="middle">5</text></g>
  <g class="gap"><circle cx="1109" cy="414" r="11"/><text x="1109" y="418.5" text-anchor="middle">6</text></g>
  <g class="gap"><circle cx="855" cy="190" r="11"/><text x="855" y="194.5" text-anchor="middle">7</text></g>
  <g class="gap"><circle cx="1109" cy="538" r="11"/><text x="1109" y="542.5" text-anchor="middle">8</text></g>

  <line x1="11" y1="584" x2="43" y2="584" class="flow" marker-end="url(#ah-teal)"/>
  <text x="52" y="588" class="lbl">data flow</text>
  <line x1="132" y1="584" x2="164" y2="584" class="checkline"/>
  <text x="173" y="588" class="lbl">check that runs today</text>
  <g class="gap"><circle cx="318" cy="584" r="9"/><text x="318" y="588" text-anchor="middle">n</text></g>
  <text x="334" y="588" class="lbl">a change I'd make next</text>
</svg>
