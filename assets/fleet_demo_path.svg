<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1130 292" role="img" aria-label="A visitor opens the Ask the Fleet Streamlit app. The Ask tab checks the question log, then sends the question to a Genie space, which runs SQL on a serverless warehouse as a service principal that can only read two metric views and write the question log; the rows and SQL come back to the app. The Report and Modeling tabs read files bundled with the app and use no compute.">
  <style>
    .node rect { fill: #1a2f4a; stroke: #3a5373; stroke-width: 1; }
    .key rect { stroke: #5fc4c0; stroke-width: 1.6; }
    .t { fill: #f2f5f9; font: 600 13.5px 'Segoe UI', 'Open Sans', Helvetica, Arial, sans-serif; }
    .d { fill: #b4c3d4; font: 400 12px 'Segoe UI', 'Open Sans', Helvetica, Arial, sans-serif; }
    .m { fill: #cfe0f2; font: 400 11.5px 'Cascadia Code', Consolas, Menlo, monospace; }
    .am { fill: #f0a742; font: 600 12px 'Segoe UI', 'Open Sans', Helvetica, Arial, sans-serif; }
    .lbl { fill: #7f95b1; font: 400 11.5px 'Segoe UI', 'Open Sans', Helvetica, Arial, sans-serif; }
    .flow { stroke: #5fc4c0; stroke-width: 1.5; fill: none; }
    .ret { stroke: #7f95b1; stroke-width: 1.2; fill: none; stroke-dasharray: 3 4; }
    .gap circle { fill: #e5736b; }
    .gap text { fill: #0e1a2b; font: 700 12px 'Segoe UI', 'Open Sans', Helvetica, Arial, sans-serif; }
  </style>
  <defs>
    <marker id="bh-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5fc4c0"/></marker>
    <marker id="bh-faint" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7f95b1"/></marker>
  </defs>

  <g class="node"><rect x="11" y="113" width="120" height="60" rx="6"/><text x="23" y="139" class="t">Visitor</text><text x="23" y="158" class="d">any browser</text></g>
  <line x1="131" y1="143" x2="169" y2="143" class="flow" marker-end="url(#bh-teal)"/>

  <g class="node key"><rect x="171" y="20" width="200" height="246" rx="6"/>
    <text x="185" y="46" class="t">Ask the Fleet</text>
    <text x="185" y="66" class="d">Streamlit Community Cloud</text>
    <text x="185" y="84" class="m">public_app/app.py</text>
    <text x="185" y="230" class="am">page load: no compute</text>
    <text x="185" y="248" class="d">since 5 Nov 2026</text>
  </g>

  <line x1="371" y1="70" x2="439" y2="70" class="flow" marker-end="url(#bh-teal)"/>
  <text x="405" y="62" class="lbl" text-anchor="middle">Ask</text>
  <line x1="371" y1="161" x2="439" y2="161" class="flow" marker-end="url(#bh-teal)"/>
  <text x="405" y="153" class="lbl" text-anchor="middle">Report</text>
  <line x1="371" y1="235" x2="439" y2="235" class="flow" marker-end="url(#bh-teal)"/>
  <text x="405" y="227" class="lbl" text-anchor="middle">Modeling</text>

  <g class="node"><rect x="441" y="20" width="190" height="100" rx="6"/><text x="453" y="46" class="t">Question log</text><text x="453" y="66" class="d">50 a day · 10 per visitor</text><text x="453" y="84" class="d">back off 15 min on failure</text></g>
  <line x1="631" y1="70" x2="669" y2="70" class="flow" marker-end="url(#bh-teal)"/>

  <g class="node"><rect x="671" y="20" width="170" height="100" rx="6"/><text x="683" y="46" class="t">Genie space</text><text x="683" y="66" class="d">2 metric views</text><text x="683" y="84" class="d">same AI instructions</text></g>
  <line x1="841" y1="70" x2="879" y2="70" class="flow" marker-end="url(#bh-teal)"/>
  <text x="860" y="62" class="lbl" text-anchor="middle">SQL</text>

  <g class="node"><rect x="881" y="20" width="238" height="100" rx="6"/><text x="893" y="46" class="t">Serverless SQL warehouse</text><text x="893" y="66" class="d">runs as a service principal:</text><text x="893" y="84" class="d">SELECT on 2 metric views,</text><text x="893" y="102" class="d">MODIFY on the question log</text></g>

  <g class="node"><rect x="441" y="136" width="190" height="50" rx="6"/><text x="453" y="157" class="m">report_snapshot.json</text><text x="453" y="175" class="d">no compute, always up</text></g>
  <g class="node"><rect x="441" y="210" width="190" height="50" rx="6"/><text x="453" y="231" class="m">model_explorer.json</text><text x="453" y="249" class="d">54 XGBoost runs + GNN</text></g>

  <path d="M1000 120 V278 H271 V269" class="ret" marker-end="url(#bh-faint)"/>
  <text x="700" y="271" class="lbl">rows + the SQL Genie wrote</text>

  <g class="gap"><circle cx="841" cy="20" r="11"/><text x="841" y="24.5" text-anchor="middle">1</text></g>
</svg>
